# Investor OS — TrueNAS 25.10 Deployment (CPU)
#
# ZFS datasets: MainPool/appsdata/investor-os.net/*
# Usage: docker compose up -d

services:
  # PostgreSQL + TimescaleDB + pgvector
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ios-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-investor}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-investor_os}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /mnt/MainPool/appsdata/investor-os.net/postgres:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG_HOST_PORT:-15432}:5432"
    networks:
      - ios-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-investor} -d ${DB_NAME:-investor_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    shm_size: 256m

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ios-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - /mnt/MainPool/appsdata/investor-os.net/redis:/data
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    networks:
      - ios-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NATS — event bus for ML model orchestration
  nats:
    image: nats:2.11-alpine
    container_name: ios-nats
    command: -js -sd /data -m 8222
    volumes:
      - /mnt/MainPool/appsdata/investor-os.net/nats:/data
    ports:
      - "${NATS_HOST_PORT:-14222}:4222"
    networks:
      - ios-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Rust API backend
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ios-api
    environment:
      DATABASE_URL: postgres://${DB_USER:-investor}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-investor_os}
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      INVESTOR_ENV: ${INVESTOR_ENV:-production}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      PAPER_TRADING: "${PAPER_TRADING:-true}"
      KILL_SWITCH_ENABLED: "true"
      WS_ENABLED: "${WS_ENABLED:-true}"
      WS_DEFAULT_EXCHANGE: binance
      WS_DEFAULT_SYMBOLS: "${WS_DEFAULT_SYMBOLS:-BTCUSDT}"
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@investor-os.com}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      ML_SIDECAR_URL: ${ML_SIDECAR_URL:-http://ml-sidecar:9000}
      ML_GPU_URL: ${ML_GPU_URL:-}
    volumes:
      - /mnt/MainPool/appsdata/investor-os.net/config:/app/config:ro
      - /mnt/MainPool/appsdata/investor-os.net/logs:/app/logs
      - /mnt/MainPool/appsdata/investor-os.net/models:/app/models:ro
      - /mnt/MainPool/appsdata/investor-os.net/market-data:/app/market-data
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    networks:
      - ios-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ML Sidecar (CPU) — Python FastAPI for model inference
  ml-sidecar:
    build:
      context: ../../services/ml-sidecar
      dockerfile: Dockerfile
    container_name: ios-ml-sidecar
    environment:
      ML_DATABASE_URL: postgresql+asyncpg://${DB_USER:-investor}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-investor_os}
      ML_REDIS_URL: redis://redis:6379
      ML_MODEL_DIR: /app/models
      ML_LOG_LEVEL: ${ML_LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      NATS_ENABLED: "${NATS_ENABLED:-true}"
    volumes:
      - /mnt/MainPool/appsdata/investor-os.net/models:/app/models:ro
      - /mnt/MainPool/appsdata/investor-os.net/logs:/app/logs
    networks:
      - ios-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # Telegram Bot — trading signals + semi-auto trade confirmation
  telegram-bot:
    build:
      context: ../../services/telegram-bot
    container_name: ios-telegram-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NATS_URL: nats://nats:4222
      DB_URL: postgresql://${DB_USER:-investor}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-investor_os}
    networks:
      - ios-net
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # Next.js frontend
  frontend:
    build:
      context: ../../frontend/investor-dashboard
      dockerfile: Dockerfile
    container_name: ios-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://api:8080}
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${FE_HOST_PORT:-13000}:3000"
    networks:
      - ios-net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  ios-net:
    driver: bridge
